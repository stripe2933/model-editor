name: Build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt install xorg-dev

      - uses: LegalizeAdulthood/vcpkg-github-cache@v1
        with:
          token: ${{ github.token }}

      - name: Configure CMake
        run: |
          mv .github/workflows/scripts/* .
          cmake --preset=${{ matrix.os }}

      - name: Build
        run: cmake --build build --config Release

      - name: Upload binary executables
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}
          path: |
            build/model-editor.exe
            build/model-editor.app
            build/model-editor
            build/*.dll
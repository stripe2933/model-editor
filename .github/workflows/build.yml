name: Build

on: push

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt install xorg-dev

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: stripe2933/http-cache-server@v0.1.0
        with:
         port: 12321

      - name: Configure CMake
        env:
          VCPKG_BINARY_SOURCES: "clear;http,http://localhost:12321/{name}-{version}-{sha},readwrite"
        run: |
          mv .github/workflows/scripts/* .
          cmake --preset=${{ matrix.os }}

      - name: Build
        run: cmake --build build --config Release

      - name: Upload binary executables
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}
          path: |
            build/model-editor.exe
            build/model-editor.app
            build/model-editor
            build/*.dll